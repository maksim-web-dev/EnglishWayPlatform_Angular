<div class="main">
  <div class="main-header">

    <ul class="main-header-nav">
      <li *ngFor="let menuItem of menu">
        <a [routerLink]="menuItem.url"
           title="{{menuItem.title}}"
           [ngClass]="{'active': currentPageByMenuItem === menuItem.name}"
        >{{ menuItem.name}}</a>
      </li>
    </ul>
    <div class="main-header-aside">
      profile:
      <span>{{roles}}</span>
      <a href="#" (click)="logout(); $event.preventDefault()">log-out</a>
    </div>
  </div>
  <div class="main-content">
    <ng-content></ng-content>
  </div>
</div>
