name: Deploy English-way Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  #  AWS_REGION: eu-central-1
#  ECR_REPOSITORY: english-way-backend
#  ECS_CLUSTER: english-way-cluster
#  ECS_SERVICE: english-way-service
#  CONTAINER_NAME: english-way-platform
#  TASK_DEFINITION: task-definition.json

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/english-way/browser/ \
          s3://${{ vars.S3_BUCKET }}/ \
          --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudront cretae-invalidation \
          -- dictribution-id $ {{ vars.CLOUDFRONT_ID}} \
          --paths "/*"
